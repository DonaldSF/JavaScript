<!DOCTYPE html>

<head>

    <title>Practica Parametros 1</title>
</head>
<body>
    <p>
    <button onclick="suma()">click aqui</button>
    </p>
    <p>primerNumero</p>
    <input type="number" id="primerNumero">
    <p>segundoNumero</p>
    <input type="number" id="segundoNumero">

    <script>
        function sumar(numero1, numero2) {
            resultado = numero1 + numero2;
            return resultado;
            }

        function suma() {
            let elementoNumero1 = parseInt(document.getElementById("primerNumero").value);
            let elementoNumero2 = parseInt(document.getElementById("segundoNumero").value);
            let elementoSuma = sumar(elementoNumero1, elementoNumero2)
            alert("El resultado es " + elementoSuma);
        }
    </script>
    
</body>
</html>
