<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prácticas Loop For 3</title>
</head>
<body>

    <script>
        function testLoop() {
            let suma = 0; 

            for (let i = 1; i <= 4; i++) {
                suma += i; 
            }

            console.log("La suma total es: " + suma);
        }


        testLoop();
    </script>

</body>
</html>
