<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prácticas Loop For 4</title>
</head>
<body>

    <script>

        function testLoop(numero) {
            console.log("Tabla de multiplicar del " + numero + ":");
            
            for (let i = 1; i <= 10; i++) {
                let resultado = numero * i;
                console.log(numero + " x " + i + " = " + resultado);
            }
        }
        testLoop(5);
    </script>

</body>
</html>
