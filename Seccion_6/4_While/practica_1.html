<!DOCTYPE html>
<html lang="es">
<head>

    <title>Practicas While 1</title>
</head>
<body>
    <script>

        function contarVueltas(limite) {
            let contador = 1;


            while (contador <= limite) {
                console.log("Vuelta numero: " + contador);

                contador++;
            }
        }


        let vueltasUsuario = parseInt(prompt("Introduce el numero de vueltas que deseas:"));


        if (!isNaN(vueltasUsuario) && vueltasUsuario > 0) {
            contarVueltas(vueltasUsuario);
        } else {
            alert("Por favor, introduce un numero valido mayor a 0.");
        }
    </script>
</body>
</html>
