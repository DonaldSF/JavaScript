<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VS Code - Code Breaker</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --vs-blue: #007acc;
            --vs-green: #4ec9b0;
            --vs-yellow: #dcdcaa;
            --vs-red: #f44336;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 450px;
            background: var(--panel-bg);
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 10px 0; color: #fff; font-size: 1.5rem; text-align: center; }
        .instructions { color: #858585; font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
        
        /* Consola de intentos */
        .terminal {
            background: #111;
            border: 1px solid #2d2d2d;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .log-entry { margin-bottom: 5px; }
        
        /* Controles de Entrada */
        .input-area { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        input {
            background: #3c3c3c;
            border: 1px solid #6b6b6b;
            color: #fff;
            font-size: 1.2rem;
            width: 120px;
            text-align: center;
            border-radius: 4px;
            font-family: monospace;
        }
        input:focus { border-color: var(--vs-blue); outline: none; }
        button {
            background: var(--vs-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
        }
        button:hover { background: #0062a3; }
        
        /* Etiquetas de pistas */
        .badge { padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 0.8rem; }
        .exact { background: var(--vs-green); color: #1e1e1e; }
        .partial { background: var(--vs-yellow); color: #1e1e1e; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔓 Code Breaker // v1.0</h1>
        <div class="instructions">Descifra el código secreto de 4 dígitos únicos (0-9).</div>
        
        <div class="terminal" id="terminal">
            <div style="color: #6a9955;">// Terminal lista. Esperando intento...</div>
        </div>

        <div class="input-area">
            <input type="text" id="guess-input" maxlength="4" placeholder="Ej: 1234" onkeydown="if(event.key==='Enter') checkCode()">
            <button onclick="checkCode()">COMPILAR</button>
        </div>
        
        <div style="text-align: center;">
            <button onclick="restartGame()" style="background:#444; font-size:0.8rem;">Reiniciar Sistema</button>
        </div>
    </div>

    <script>
        let secretCode = [];
        let attempts = 0;
        const terminal = document.getElementById('terminal');
        const guessInput = document.getElementById('guess-input');

        function restartGame() {
            secretCode = [];
            attempts = 0;
            terminal.innerHTML = '<div style="color: #6a9955;">// Sistema reiniciado. Nuevo código generado.</div>';
            guessInput.value = '';
            guessInput.disabled = false;
            
            // Generar 4 números aleatorios únicos
            while(secretCode.length < 4) {
                let num = Math.floor(Math.random() * 10).toString();
                if(!secretCode.includes(num)) secretCode.push(num);
            }
            // Consola oculta para pruebas (borrar o comentar si no quieres verla):
            console.log("Cheat:", secretCode.join('')); 
        }

        function checkCode() {
            let guess = guessInput.value.trim();
            
            // Validaciones
            if (guess.length !== 4 || isNaN(guess)) {
                logToTerminal('⚠️ Error: Deben ser exactamente 4 números.', 'var(--vs-red)');
                return;
            }
            if (new Set(guess).size !== 4) {
                logToTerminal('⚠️ Error: Los números no pueden repetirse.', 'var(--vs-red)');
                return;
            }

            attempts++;
            let exacts = 0;
            let partials = 0;
            let guessArray = guess.split('');

            // Calcular pistas
            for (let i = 0; i < 4; i++) {
                if (guessArray[i] === secretCode[i]) {
                    exacts++;
                } else if (secretCode.includes(guessArray[i])) {
                    partials++;
                }
            }

            // Mostrar resultado en la terminal ficticia
            let resultHTML = `Intento #${attempts} [${guess}] -> `;
            if (exacts > 0) resultHTML += `<span class="badge exact">${exacts} Correctos</span> `;
            if (partials > 0) resultHTML += `<span class="badge partial">${partials} Desplazados</span>`;
            if (exacts === 0 && partials === 0) resultHTML += `<span style="color:#858585;">0 coincidencias</span>`;
            
            logToTerminal(resultHTML);
            guessInput.value = '';

            // Condición de victoria
            if (exacts === 4) {
                logToTerminal(`🎉 ¡ACCESO CONCEDIDO! Código roto en ${attempts} intentos.`, 'var(--vs-green)');
                guessInput.disabled = true;
            }
        }

        function logToTerminal(message, color = 'var(--text-color)') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = color;
            entry.innerHTML = message;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight; // Auto-scroll al final
        }

        // Iniciar al cargar
        restartGame();
    </script>
</body>
</html>
