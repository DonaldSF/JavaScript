<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Carreras - Modo Multijugador</title>
    <style>
        body { margin: 0; background: #1a1a1a; text-align: center; font-family: sans-serif; color: white; }
        canvas { background: #333; display: block; margin: 10px auto; border: 4px solid #fff; }
        .info { font-size: 20px; font-weight: bold; margin-top: 10px; color: #ffeb3b; }
        .controls { display: flex; justify-content: center; gap: 50px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Modo 2 Jugadores (Local)</h1>
    <div class="controls">
        <p><span style="color:deepskyblue">■</span> <b>J1 (Azul):</b> Flechas del Teclado</p>
        <p><span style="color:springgreen">■</span> <b>J2 (Verde):</b> Teclas W, A, S, D</p>
    </div>
    <div class="info" id="ganador">¡Que gane el mejor!</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const META_X = 730;
        const keys = {};

        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        class PlayerCar {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.w = 45;
                this.h = 22;
                this.color = color;
                this.controls = controls; // {up, down, left, right}
                this.speed = 0;
                this.maxSpeed = 6;
                this.acc = 0.12;
                this.friction = 0.05;
                this.finished = false;
            }

            update() {
                if (this.x >= META_X) {
                    this.finished = true;
                }

                if (!this.finished) {
                    // Controles dinámicos por jugador
                    if (keys[this.controls.right]) this.speed += this.acc;
                    if (keys[this.controls.left]) this.speed -= this.acc;
                    if (keys[this.controls.up]) this.y -= 4;
                    if (keys[this.controls.down]) this.y += 4;

                    // Límites de velocidad y fricción
                    if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
                    if (this.speed < -2) this.speed = -2;
                    this.speed *= (1 - this.friction);

                    this.x += this.speed;
                }

                // Límites de pista
                if (this.y < 80) this.y = 80;
                if (this.y > 300) this.y = 300;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                // Detalles visuales (parabrisas y llantas)
                ctx.fillStyle = "#000";
                ctx.fillRect(this.x + 30, this.y + 3, 5, 16);
                ctx.fillRect(this.x + 5, this.y - 3, 10, 3);
                ctx.fillRect(this.x + 30, this.y - 3, 10, 3);
                ctx.fillRect(this.x + 5, this.y + this.h, 10, 3);
                ctx.fillRect(this.x + 30, this.y + this.h, 10, 3);
            }
        }

        // Configuración de controles para ambos jugadores
        const p1 = new PlayerCar(20, 130, "deepskyblue", {
            up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight"
        });

        const p2 = new PlayerCar(20, 240, "springgreen", {
            up: "KeyW", down: "KeyS", left: "KeyA", right: "KeyD"
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Pista
            ctx.fillStyle = "#444";
            ctx.fillRect(0, 70, canvas.width, 260);

            // Línea divisoria central
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(0, 200);
            ctx.lineTo(canvas.width, 200);
            ctx.stroke();
            ctx.setLineDash([]); // Resetear

            // Línea de Meta
            ctx.fillStyle = "#fff";
            for (let i = 70; i < 330; i += 20) {
                ctx.fillRect(META_X, i, 15, 10);
                ctx.fillRect(META_X + 15, i + 10, 15, 10);
            }

            // Actualizar y dibujar
            p1.update();
            p1.draw();
            p2.update();
            p2.draw();

            // Comprobar ganador
            const ganadorEl = document.getElementById("ganador");
            if (p1.finished && !p2.finished) {
                ganadorEl.innerHTML = "<span style='color:deepskyblue'>¡HA GANADO EL JUGADOR 1 (AZUL)!</span>";
            } else if (p2.finished && !p1.finished) {
                ganadorEl.innerHTML = "<span style='color:springgreen'>¡HA GANADO EL JUGADOR 2 (VERDE)!</span>";
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
